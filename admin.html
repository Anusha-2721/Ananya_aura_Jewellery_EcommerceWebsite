
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Ananya Aura Jewellery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #741344;
        }

        h2, h3 {
            color: #741344;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
        }

        .section {
            background: white;
            padding: 20px;
            margin: 25px 0;
            border-radius: 15px;
            box-shadow: 0 0 10px #ccc;
        }

        .order-card, .product-card {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 0 8px #ddd;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        label {
            font-weight: bold;
        }

        button {
            padding: 10px 15px;
            margin: 8px 5px 0 0;
            background: #741344;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        button:disabled {
            background: gray;
            cursor: not-allowed;
        }

        .delete-btn {
            background: #c62828;
        }

        .edit-btn {
            background: #1565c0;
        }

        .confirmed {
            color: green;
            font-weight: bold;
        }

        .pending {
            color: #d97706;
            font-weight: bold;
        }

        .product-image {
            width: 120px;
            height: 120px;
            object-fit: contain;
            border-radius: 8px;
        }

        .nav-buttons {
            text-align: center;
            margin: 20px;
        }
    </style>
</head>

<body>

<h1>💎 Ananya Aura Jewellery - Admin Panel</h1>

<div class="nav-buttons">
    <button onclick="showSection('productsSection')">
        Manage Products
    </button>

    <button onclick="showSection('ordersSection')">
        Manage Orders
    </button>
    <button onclick="showSection('returnsSection'); loadReturns();">
        Manage Returns
    </button>
</div>

<div class="container">

    <!-- PRODUCT MANAGEMENT -->

    <div class="section" id="productsSection">

        <h2>Manage Products</h2>

        <h3 id="formHeading">Add New Product</h3>

        <form id="productForm">

            <input type="hidden" id="productId">

            <label>Product Name</label>
            <input type="text" id="productName"
                   placeholder="Enter product name" required>

            <label>Price (₹)</label>
            <input type="number" id="productPrice"
                   placeholder="Enter price" min="0" step="1" required>

            <label>Image Filename</label>
            <input type="text" id="productImage"
                   placeholder="Example: ca1.png">

            <label>Category</label>
            <select id="productCategory">
                <option value="">Select Category</option>
                <option value="Men">Men</option>
                <option value="Women">Women</option>
                <option value="Rings">Rings</option>
                <option value="Necklaces">Necklaces</option>
                <option value="Chains">Chains</option>
                <option value="Bracelets">Bracelets</option>
                <option value="Other">Other</option>
            </select>

            <button type="submit" id="submitBtn">
                Add Product
            </button>

            <button type="button" id="cancelEditBtn"
                    onclick="resetProductForm()" hidden>
                Cancel Edit
            </button>

        </form>

        <hr>

        <h2>All Products</h2>

        <div id="productsList">
            Loading Products...
        </div>

    </div>


    <!-- ORDER MANAGEMENT -->

    <div class="section" id="ordersSection" hidden>

        <h2>Manage Orders</h2>

        <div id="orders">
            Loading Orders...
        </div>

    </div>
    <!-- RETURN MANAGEMENT -->

      <div class="section" id="returnsSection" hidden>

           <h2>Manage Return Requests</h2>

           <button onclick="loadReturns()">Refresh Returns</button>

            <div id="returns">
                Loading Return Requests...
           </div>

</div>

</div>


<script>

const API = "https://ecommerce-website-n3ur.onrender.com";


// ADMIN PROTECTION

if (localStorage.getItem("admin") !== "true") {
    alert("Access Denied");
    window.location.href = "adminLogin.html";
}


// SECTION SWITCH

function showSection(sectionId) {

    document.getElementById("productsSection").hidden =
        sectionId !== "productsSection";

    document.getElementById("ordersSection").hidden =
        sectionId !== "ordersSection";

    document.getElementById("returnsSection").hidden =
        sectionId !== "returnsSection";

}


// ESCAPE HTML

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[char]);
}


// ------------------------------------
// PRODUCT MANAGEMENT
// ------------------------------------


// LOAD PRODUCTS

async function loadProducts() {

    const container = document.getElementById("productsList");

    try {

        container.innerHTML = "Loading Products...";

        const res = await fetch(`${API}/api/products`);

        if (!res.ok) {
            throw new Error("Unable to load products");
        }

        const products = await res.json();

        container.innerHTML = "";

        if (!products.length) {
            container.innerHTML = "<h3>No Products Found</h3>";
            return;
        }

        products.forEach(product => {

            const imageHTML = product.image
                ? `<img class="product-image"
                       src="${escapeHTML(product.image)}"
                       alt="${escapeHTML(product.name)}"
                       onerror="this.style.display='none'">`
                : "";

            container.innerHTML += `

                <div class="product-card">

                    ${imageHTML}

                    <h3>${escapeHTML(product.name)}</h3>

                    <p><b>Product ID:</b> ${Number(product.id)}</p>

                    <p><b>Price:</b> ₹${Number(product.price)}</p>

                    <p><b>Category:</b> ${escapeHTML(product.category)}</p>

                    <p><b>Image:</b> ${escapeHTML(product.image)}</p>

                    <button class="edit-btn"
                        onclick="editProduct(${Number(product.id)})">
                        Edit
                    </button>

                    <button class="delete-btn"
                        onclick="deleteProduct(${Number(product.id)})">
                        Delete
                    </button>

                </div>

            `;

        });

    } catch (error) {

        console.error(error);

        container.innerHTML =
            "<h3>Unable to load products. Check backend.</h3>";

    }

}


// ADD OR UPDATE PRODUCT

document.getElementById("productForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const id = document.getElementById("productId").value;

    const product = {

        name: document.getElementById("productName").value.trim(),

        price: Number(document.getElementById("productPrice").value),

        image: document.getElementById("productImage").value.trim(),

        category: document.getElementById("productCategory").value

    };

    if (!product.name || !Number.isInteger(product.price) ||
        product.price < 0) {

        alert("Enter a valid product name and price");
        return;

    }

    try {

        const url = id
            ? `${API}/api/products/${id}`
            : `${API}/api/products`;

        const method = id ? "PUT" : "POST";

        const res = await fetch(url, {

            method: method,

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(product)

        });

        const data = await res.json();

        if (!res.ok) {
            throw new Error(data.message || "Product operation failed");
        }

        alert(data.message);

        resetProductForm();

        loadProducts();

    } catch (error) {

        console.error(error);

        alert(error.message || "Something went wrong");

    }

});


// EDIT PRODUCT

async function editProduct(id) {

    try {

        const res = await fetch(`${API}/api/products`);

        if (!res.ok) {
            throw new Error("Unable to fetch products");
        }

        const products = await res.json();

        const product = products.find(item =>
            Number(item.id) === Number(id)
        );

        if (!product) {
            alert("Product not found");
            return;
        }

        document.getElementById("productId").value = product.id;

        document.getElementById("productName").value = product.name;

        document.getElementById("productPrice").value = product.price;

        document.getElementById("productImage").value =
            product.image || "";

        document.getElementById("productCategory").value =
            product.category || "";

        document.getElementById("formHeading").innerText =
            "Edit Product";

        document.getElementById("submitBtn").innerText =
            "Update Product";

        document.getElementById("cancelEditBtn").hidden = false;

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } catch (error) {

        alert(error.message);

    }

}


// DELETE PRODUCT

async function deleteProduct(id) {

    if (!confirm("Are you sure you want to delete this product?")) {
        return;
    }

    try {

        const res = await fetch(`${API}/api/products/${id}`, {
            method: "DELETE"
        });

        const data = await res.json();

        if (!res.ok) {
            throw new Error(data.message || "Delete failed");
        }

        alert(data.message);

        loadProducts();

    } catch (error) {

        alert(error.message);

    }

}


// RESET FORM

function resetProductForm() {

    document.getElementById("productForm").reset();

    document.getElementById("productId").value = "";

    document.getElementById("formHeading").innerText =
        "Add New Product";

    document.getElementById("submitBtn").innerText =
        "Add Product";

    document.getElementById("cancelEditBtn").hidden = true;

}


// ------------------------------------
// ORDER MANAGEMENT
// ------------------------------------


// LOAD ORDERS

async function loadOrders() {

    const container = document.getElementById("orders");

    try {

        container.innerHTML = "<h3>Loading Orders...</h3>";

        const res = await fetch(`${API}/api/orders/admin/all`);

        if (!res.ok) {
            throw new Error("Unable to load orders");
        }

        const orders = await res.json();

        container.innerHTML = "";

        if (!orders.length) {
            container.innerHTML = "<h2>No Orders Found</h2>";
            return;
        }

        orders.forEach(order => {

            let actionButton = "";

            if (order.status === "Processing") {

                actionButton = `
                    <button onclick="updateStatus(${Number(order.id)}, 'Shipped')">
                        Mark as Shipped
                    </button>
                `;

            }

            if (order.status === "Shipped") {

                if (Number(order.customer_confirmed) === 1) {

                    actionButton = `
                        <p class="confirmed">
                            ✓ Customer Confirmed Delivery
                        </p>

                        <button onclick="updateStatus(${Number(order.id)}, 'Delivered')">
                            Mark as Delivered
                        </button>
                    `;

                } else {

                    actionButton = `
                        <p class="pending">
                            Waiting for Customer Confirmation
                        </p>

                        <button disabled>Mark as Delivered</button>
                    `;

                }

            }

            container.innerHTML += `

                <div class="order-card">

                    <h2>Order ID: #${Number(order.id)}</h2>

                    <p><b>Customer:</b> ${escapeHTML(order.customer_name)}</p>

                    <p><b>Email:</b> ${escapeHTML(order.email)}</p>

                    <p><b>Phone:</b> ${escapeHTML(order.phone)}</p>

                    <p><b>Address:</b> ${escapeHTML(order.address)}</p>

                    <p><b>Location:</b> ${escapeHTML(order.location)}</p>

                    <hr>

                    <h3>Products</h3>

                    <p>${escapeHTML(order.product_name)}</p>

                    <p><b>Quantity:</b> ${Number(order.quantity)}</p>

                    <p><b>Total:</b> ₹${Number(order.total).toFixed(2)}</p>

                    <p><b>Payment:</b> ${escapeHTML(order.payment_method)}</p>

                    <p><b>Order Status:</b> ${escapeHTML(order.status)}</p>

                    ${
                        order.status === "Cancelled"
                        ? "<p style='color:red'>Order Cancelled</p>"
                        : actionButton
                    }

                </div>

            `;

        });

    } catch (error) {

        console.error(error);

        container.innerHTML =
            "<h3>Unable to load orders. Check your backend.</h3>";

    }

}


// UPDATE ORDER STATUS

async function updateStatus(id, status) {

    const message = status === "Shipped"
        ? "Are you sure you want to mark this order as Shipped?"
        : "Has the customer confirmed receiving this parcel?";

    if (!confirm(message)) return;

    try {

        const res = await fetch(`${API}/api/orders/admin/status/${id}`, {

            method: "PUT",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({ status })

        });

        const data = await res.json();

        if (!res.ok) {
            throw new Error(data.message || "Status update failed");
        }

        alert(data.message);

        loadOrders();

    } catch (error) {

        alert(error.message || "Status update failed");

    }

}
// ------------------------------------
// RETURN MANAGEMENT
// ------------------------------------

// LOAD RETURN REQUESTS

async function loadReturns() {

    const container = document.getElementById("returns");

    try {

        container.innerHTML = "<h3>Loading Return Requests...</h3>";

        const res = await fetch(`${API}/api/orders/admin/returns`);

        if (!res.ok) {
            throw new Error("Unable to load return requests");
        }

        const returns = await res.json();

        container.innerHTML = "";

        if (!Array.isArray(returns) || returns.length === 0) {
            container.innerHTML = "<h3>No Return Requests Found</h3>";
            return;
        }

        returns.forEach(order => {

            let actionButtons = "";

            if (order.return_status === "Requested") {

                actionButtons = `
                    <button
                        onclick="updateReturnStatus(${Number(order.id)}, 'Approved')">
                        Approve Return
                    </button>

                    <button class="delete-btn"
                        onclick="updateReturnStatus(${Number(order.id)}, 'Rejected')">
                        Reject Return
                    </button>
                `;

            }

            const statusColor =
                order.return_status === "Approved" ? "green" :
                order.return_status === "Rejected" ? "red" : "#d97706";

            container.innerHTML += `

                <div class="order-card">

                    <h2>Return Request - Order #${Number(order.id)}</h2>

                    <p><b>Customer:</b>
                        ${escapeHTML(order.customer_name)}
                    </p>

                    <p><b>Email:</b>
                        ${escapeHTML(order.email)}
                    </p>

                    <p><b>Phone:</b>
                        ${escapeHTML(order.phone)}
                    </p>

                    <p><b>Product:</b>
                        ${escapeHTML(order.product_name)}
                    </p>

                    <p><b>Quantity:</b>
                        ${Number(order.quantity)}
                    </p>

                    <p><b>Order Total:</b>
                        ₹${Number(order.total).toFixed(2)}
                    </p>

                    <p><b>Return Reason:</b>
                        ${escapeHTML(order.return_reason || "Not provided")}
                    </p>

                    <p><b>Return Requested At:</b>
                        ${escapeHTML(order.return_requested_at || "Not available")}
                    </p>

                    <p>
                        <b>Return Status:</b>
                        <span style="color:${statusColor};font-weight:bold">
                            ${escapeHTML(order.return_status)}
                        </span>
                    </p>

                    ${actionButtons}

                </div>

            `;

        });

    } catch (error) {

        console.error(error);

        container.innerHTML =
            "<h3>Unable to load return requests. Check backend.</h3>";

    }

}


// APPROVE OR REJECT RETURN

async function updateReturnStatus(id, status) {

    const message = status === "Approved"
        ? "Are you sure you want to approve this return?"
        : "Are you sure you want to reject this return?";

    if (!confirm(message)) return;

    try {

        const res = await fetch(
            `${API}/api/orders/admin/return/${id}`,
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({ status })
            }
        );

        const data = await res.json();

        if (!res.ok) {
            throw new Error(data.message || "Return status update failed");
        }

        alert(data.message || `Return ${status} successfully`);

        loadReturns();

    } catch (error) {

        console.error(error);

        alert(error.message || "Unable to update return status");

    }

}

// INITIAL LOAD
if (localStorage.getItem("admin") === "true") {

    loadProducts();

    loadOrders();

    loadReturns();

}

</script>

</body>
</html>
